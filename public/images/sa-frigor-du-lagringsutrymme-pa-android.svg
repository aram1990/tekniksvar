<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0F172A"/>

  <rect x="180" y="90" width="440" height="270" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>

  <!-- Storage Meter Header -->
  <text x="220" y="140" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Internlagring på Android</text>

  <!-- Progress Bar Container -->
  <rect x="220" y="170" width="360" height="30" rx="15" fill="#0F172A"/>
  <!-- Used Space -->
  <rect x="220" y="170" width="290" height="30" rx="15" fill="#2563EB"/>
  <!-- Cleanable Space -->
  <rect x="430" y="170" width="80" height="30" fill="#EF4444"/>

  <text x="220" y="235" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">Använt: 112 GB av 128 GB (87 %)</text>

  <!-- Cleaned State Preview -->
  <rect x="220" y="260" width="360" height="60" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="240" y="295" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#34D399">Frigör upp till 24 GB skräpfiler & cache</text>
</svg>