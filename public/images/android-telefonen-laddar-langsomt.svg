<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0F172A"/>

  <!-- Phone Shell -->
  <rect x="310" y="70" width="180" height="310" rx="24" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>

  <!-- Screen Area -->
  <rect x="325" y="95" width="150" height="240" rx="12" fill="#0F172A"/>

  <!-- Battery Outline -->
  <rect x="365" y="150" width="70" height="120" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <rect x="385" y="142" width="30" height="8" rx="2" fill="#38BDF8"/>

  <!-- Battery Fill Level -->
  <rect x="371" y="220" width="58" height="44" rx="4" fill="#F59E0B"/>

  <!-- Lightning Bolt -->
  <path d="M405 170 L385 205 H405 L395 245 L420 200 H400 L405 170Z" fill="#38BDF8"/>

  <text x="400" y="300" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FBBF24" text-anchor="middle">Långsam laddning</text>
</svg>